<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyRoad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#29B6F6"/>
      <stop offset="60%" stop-color="#E1F5FE"/>
      <stop offset="100%" stop-color="#FFF9C4"/>
    </linearGradient>
    <linearGradient id="villageRoad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8D6E63"/>
      <stop offset="100%" stop-color="#6D4C41"/>
    </linearGradient>
  </defs>

  <rect width="800" height="360" fill="url(#skyRoad)"/>
  <!-- Green village trees on roadside -->
  <circle cx="100" cy="300" r="80" fill="#2E7D32"/>
  <circle cx="220" cy="310" r="60" fill="#388E3C"/>
  <circle cx="680" cy="290" r="90" fill="#2E7D32"/>
  <circle cx="780" cy="310" r="70" fill="#43A047"/>

  <!-- Country Road -->
  <rect y="360" width="800" height="240" fill="url(#villageRoad)"/>
  <!-- Road track lines -->
  <line x1="0" y1="460" x2="800" y2="460" stroke="#5D4037" stroke-width="4" stroke-dasharray="25 15"/>

  <!-- Tractor with Heavy Duty Trolley Transport -->
  <g transform="translate(180, 260) scale(0.9)">
    <!-- Trolley Bed -->
    <rect x="-170" y="50" width="200" height="70" rx="3" fill="#1B5E20" stroke="#2E7D32" stroke-width="3"/>
    <!-- Trolley side rails -->
    <line x1="-130" y1="50" x2="-130" y2="120" stroke="#2E7D32" stroke-width="3"/>
    <line x1="-80" y1="50" x2="-80" y2="120" stroke="#2E7D32" stroke-width="3"/>
    <line x1="-30" y1="50" x2="-30" y2="120" stroke="#2E7D32" stroke-width="3"/>
    <!-- Farm produce loaded (Sugarcane / sacks stacked high) -->
    <path d="M-160 50 Q -110 0, -60 50 Q -10 10, 20 50 Z" fill="#FBC02D" stroke="#F57F17" stroke-width="3"/>
    <!-- Trolley Double Wheels -->
    <circle cx="-110" cy="130" r="28" fill="#212121"/>
    <circle cx="-110" cy="130" r="14" fill="#5D4037"/>
    <circle cx="-40" cy="130" r="28" fill="#212121"/>
    <circle cx="-40" cy="130" r="14" fill="#5D4037"/>
    <!-- Drawbar hitch connecting to tractor -->
    <line x1="30" y1="105" x2="80" y2="115" stroke="#424242" stroke-width="7"/>

    <!-- Tractor -->
    <polygon points="120,20 180,20 205,65 120,65" fill="#212121"/>
    <polygon points="128,26 174,26 195,60 128,60" fill="#E1F5FE" opacity="0.8"/>
    <rect x="115" y="14" width="70" height="8" rx="2" fill="#FBC02D"/>
    <!-- Tractor Bonnet -->
    <path d="M180 65 L270 65 Q 290 65, 290 85 L290 110 L180 110 Z" fill="#C62828"/>
    <!-- Tractor Wheels -->
    <circle cx="125" cy="110" r="45" fill="#212121"/>
    <circle cx="125" cy="110" r="26" fill="#FBC02D" stroke="#E65100" stroke-width="2.5"/>
    <circle cx="255" cy="120" r="25" fill="#212121"/>
    <circle cx="255" cy="120" r="14" fill="#FBC02D"/>
  </g>

  <!-- Tag badge -->
  <rect x="24" y="24" width="280" height="44" rx="22" fill="rgba(0,0,0,0.65)"/>
  <circle cx="46" cy="46" r="12" fill="#2E7D32"/>
  <text x="70" y="52" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold">Trolley Transport (டிராலி)</text>
</svg>

