<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="sky1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#81D4FA"/>
      <stop offset="60%" stop-color="#E1F5FE"/>
      <stop offset="100%" stop-color="#FFF9C4"/>
    </linearGradient>
    <linearGradient id="soilDeep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5D4037"/>
      <stop offset="100%" stop-color="#3E2723"/>
    </linearGradient>
    <linearGradient id="soilLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8D6E63"/>
      <stop offset="100%" stop-color="#5D4037"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="340" fill="url(#sky1)"/>
  <!-- Sun -->
  <circle cx="680" cy="90" r="50" fill="#FFF176" opacity="0.85"/>
  <circle cx="680" cy="90" r="70" fill="#FFF9C4" opacity="0.4"/>

  <!-- Distant Coconut Trees & Greenery -->
  <path d="M0 320 Q 200 290, 400 310 T 800 300 L 800 360 L 0 360 Z" fill="#2E7D32" opacity="0.8"/>
  <g stroke="#1B5E20" stroke-width="4">
    <path d="M120 320 Q 125 240, 115 190 M115 190 Q 75 195, 60 215 M115 190 Q 110 165, 95 155 M115 190 Q 140 160, 150 175 M115 190 Q 160 195, 175 220"/>
    <path d="M720 310 Q 715 230, 725 180 M725 180 Q 685 185, 670 205 M725 180 Q 720 155, 705 145 M725 180 Q 750 150, 760 165 M725 180 Q 770 185, 785 210"/>
  </g>

  <!-- Field Base -->
  <rect y="330" width="800" height="270" fill="url(#soilDeep)"/>

  <!-- Furrows / Ploughed Ridges -->
  <path d="M0 370 Q 400 350, 800 365 L 800 410 Q 400 395, 0 410 Z" fill="url(#soilLight)"/>
  <path d="M0 420 Q 400 405, 800 420 L 800 470 Q 400 455, 0 470 Z" fill="#4E342E"/>
  <path d="M0 480 Q 400 465, 800 480 L 800 540 Q 400 525, 0 540 Z" fill="url(#soilLight)"/>
  <path d="M0 550 Q 400 535, 800 550 L 800 600 Q 400 585, 0 600 Z" fill="#3E2723"/>

  <!-- Tractor with Disc Plough -->
  <g transform="translate(320, 240) scale(0.9)">
    <!-- Cabin Frame -->
    <polygon points="60,20 120,20 145,65 60,65" fill="#212121"/>
    <polygon points="68,26 114,26 135,60 68,60" fill="#E1F5FE" opacity="0.8"/>
    <rect x="55" y="14" width="70" height="8" rx="2" fill="#FBC02D"/>
    <!-- Driver -->
    <circle cx="95" cy="40" r="8" fill="#424242"/>
    <rect x="88" y="48" width="16" height="17" fill="#1565C0"/>
    <!-- Hood -->
    <path d="M120 65 L210 65 Q 230 65, 230 85 L230 110 L120 110 Z" fill="#C62828"/>
    <!-- Exhaust & Grill -->
    <rect x="180" y="20" width="6" height="45" fill="#37474F"/>
    <rect x="224" y="80" width="6" height="25" fill="#212121"/>
    <circle cx="226" cy="85" r="4" fill="#FFF59D"/>
    <!-- Rear Mudguard -->
    <path d="M35 70 Q 65 45, 95 70 L95 100 L35 100 Z" fill="#B71C1C"/>
    <!-- Wheels -->
    <circle cx="65" cy="110" r="45" fill="#212121"/>
    <circle cx="65" cy="110" r="26" fill="#FBC02D" stroke="#E65100" stroke-width="2.5"/>
    <circle cx="65" cy="110" r="10" fill="#424242"/>
    <circle cx="195" cy="120" r="25" fill="#212121"/>
    <circle cx="195" cy="120" r="14" fill="#FBC02D"/>
    <!-- Disc Plough Hitch and 3 Discs cutting soil -->
    <line x1="35" y1="105" x2="-60" y2="135" stroke="#37474F" stroke-width="6"/>
    <ellipse cx="-45" cy="138" rx="14" ry="18" fill="#616161" stroke="#212121" stroke-width="3"/>
    <ellipse cx="-15" cy="132" rx="14" ry="18" fill="#757575" stroke="#212121" stroke-width="3"/>
    <ellipse cx="15" cy="126" rx="14" ry="18" fill="#9E9E9E" stroke="#212121" stroke-width="3"/>
  </g>

  <!-- Tag badge -->
  <rect x="24" y="24" width="230" height="44" rx="22" fill="rgba(0,0,0,0.65)"/>
  <circle cx="46" cy="46" r="12" fill="#2E7D32"/>
  <text x="70" y="52" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold">Deep Ploughing (உழவு)</text>
</svg>

