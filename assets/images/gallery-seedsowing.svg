<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="sky3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4DB6AC"/>
      <stop offset="60%" stop-color="#E0F2F1"/>
      <stop offset="100%" stop-color="#FFFDE7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="330" fill="url(#sky3)"/>
  <!-- Mountain ridge -->
  <path d="M0 310 Q 300 240, 500 280 T 800 290 L 800 350 L 0 350 Z" fill="#388E3C" opacity="0.7"/>

  <!-- Field with parallel lines for precision sowing -->
  <rect y="330" width="800" height="270" fill="#5D4037"/>

  <!-- Precision planting rows in perspective -->
  <line x1="100" y1="330" x2="-100" y2="600" stroke="#795548" stroke-width="6"/>
  <line x1="220" y1="330" x2="80" y2="600" stroke="#795548" stroke-width="7"/>
  <line x1="340" y1="330" x2="260" y2="600" stroke="#795548" stroke-width="8"/>
  <line x1="460" y1="330" x2="440" y2="600" stroke="#795548" stroke-width="8"/>
  <line x1="580" y1="330" x2="620" y2="600" stroke="#795548" stroke-width="8"/>
  <line x1="700" y1="330" x2="800" y2="600" stroke="#795548" stroke-width="7"/>

  <!-- Little green sprouts emerging in rows -->
  <g fill="#81C784">
    <ellipse cx="275" cy="400" rx="3" ry="5"/>
    <ellipse cx="282" cy="400" rx="3" ry="5"/>
    <ellipse cx="265" cy="450" rx="4" ry="7"/>
    <ellipse cx="274" cy="450" rx="4" ry="7"/>
    <ellipse cx="250" cy="510" rx="5" ry="9"/>
    <ellipse cx="262" cy="510" rx="5" ry="9"/>

    <ellipse cx="445" cy="400" rx="3" ry="5"/>
    <ellipse cx="452" cy="400" rx="3" ry="5"/>
    <ellipse cx="443" cy="450" rx="4" ry="7"/>
    <ellipse cx="452" cy="450" rx="4" ry="7"/>
    <ellipse cx="440" cy="510" rx="5" ry="9"/>
    <ellipse cx="452" cy="510" rx="5" ry="9"/>

    <ellipse cx="615" cy="400" rx="3" ry="5"/>
    <ellipse cx="622" cy="400" rx="3" ry="5"/>
    <ellipse cx="625" cy="450" rx="4" ry="7"/>
    <ellipse cx="634" cy="450" rx="4" ry="7"/>
    <ellipse cx="640" cy="510" rx="5" ry="9"/>
    <ellipse cx="652" cy="510" rx="5" ry="9"/>
  </g>

  <!-- Tractor with Seed Drill Box -->
  <g transform="translate(360, 240) scale(0.85)">
    <!-- Cabin -->
    <polygon points="70,20 130,20 155,65 70,65" fill="#212121"/>
    <polygon points="78,26 124,26 145,60 78,60" fill="#E1F5FE" opacity="0.8"/>
    <rect x="65" y="14" width="70" height="8" rx="2" fill="#FBC02D"/>
    <!-- Tractor Bonnet -->
    <path d="M130 65 L220 65 Q 240 65, 240 85 L240 110 L130 110 Z" fill="#C62828"/>
    <!-- Wheels -->
    <circle cx="75" cy="110" r="45" fill="#212121"/>
    <circle cx="75" cy="110" r="26" fill="#FBC02D" stroke="#E65100" stroke-width="2.5"/>
    <circle cx="205" cy="120" r="25" fill="#212121"/>
    <circle cx="205" cy="120" r="14" fill="#FBC02D"/>
    <!-- Seed Drill Box & Tubes -->
    <polygon points="-40,70 10,70 0,110 -30,110" fill="#2E7D32" stroke="#1B5E20" stroke-width="2"/>
    <line x1="-35" y1="110" x2="-40" y2="135" stroke="#FFA000" stroke-width="3"/>
    <line x1="-15" y1="110" x2="-15" y2="135" stroke="#FFA000" stroke-width="3"/>
    <line x1="5" y1="110" x2="10" y2="135" stroke="#FFA000" stroke-width="3"/>
  </g>

  <!-- Tag badge -->
  <rect x="24" y="24" width="240" height="44" rx="22" fill="rgba(0,0,0,0.65)"/>
  <circle cx="46" cy="46" r="12" fill="#2E7D32"/>
  <text x="70" y="52" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold">Seed Sowing (விதைத்தல்)</text>
</svg>

