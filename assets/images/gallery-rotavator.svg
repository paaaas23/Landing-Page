<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="sky2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="70%" stop-color="#B2EBF2"/>
      <stop offset="100%" stop-color="#FFF9C4"/>
    </linearGradient>
    <linearGradient id="tilledSoil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6D4C41"/>
      <stop offset="100%" stop-color="#4E342E"/>
    </linearGradient>
  </defs>

  <rect width="800" height="320" fill="url(#sky2)"/>
  <!-- Distant green trees -->
  <path d="M0 310 C 150 290, 250 330, 400 300 C 550 280, 700 320, 800 305 L 800 360 L 0 360 Z" fill="#388E3C"/>

  <!-- Finely pulverised soil -->
  <rect y="330" width="800" height="270" fill="url(#tilledSoil)"/>

  <!-- Fine texture waves -->
  <path d="M0 360 Q 200 355, 400 360 T 800 360" stroke="#8D6E63" stroke-width="4" stroke-dasharray="8 6"/>
  <path d="M0 400 Q 200 395, 400 400 T 800 400" stroke="#8D6E63" stroke-width="5" stroke-dasharray="10 8"/>
  <path d="M0 450 Q 200 445, 400 450 T 800 450" stroke="#5D4037" stroke-width="6" stroke-dasharray="12 10"/>
  <path d="M0 510 Q 200 505, 400 510 T 800 510" stroke="#3E2723" stroke-width="7" stroke-dasharray="14 12"/>

  <!-- Tractor working with Rotavator -->
  <g transform="translate(280, 230) scale(0.95)">
    <!-- Cabin -->
    <polygon points="70,20 130,20 155,65 70,65" fill="#212121"/>
    <polygon points="78,26 124,26 145,60 78,60" fill="#E1F5FE" opacity="0.8"/>
    <rect x="65" y="14" width="70" height="8" rx="2" fill="#FBC02D"/>
    <!-- Driver -->
    <circle cx="105" cy="40" r="8" fill="#424242"/>
    <rect x="98" y="48" width="16" height="17" fill="#E65100"/>
    <!-- Tractor Bonnet -->
    <path d="M130 65 L220 65 Q 240 65, 240 85 L240 110 L130 110 Z" fill="#2E7D32"/>
    <!-- Wheels -->
    <circle cx="75" cy="110" r="45" fill="#212121"/>
    <circle cx="75" cy="110" r="26" fill="#FBC02D" stroke="#5D4037" stroke-width="2.5"/>
    <circle cx="205" cy="120" r="25" fill="#212121"/>
    <circle cx="205" cy="120" r="14" fill="#FBC02D"/>
    <!-- Rotavator Box & Soil Spray -->
    <rect x="-30" y="85" width="70" height="35" rx="4" fill="#1B5E20" stroke="#2E7D32" stroke-width="2"/>
    <circle cx="-10" cy="122" r="12" fill="#FFA000" stroke="#3E2723" stroke-width="3"/>
    <circle cx="20" cy="122" r="12" fill="#FFA000" stroke="#3E2723" stroke-width="3"/>
    <!-- Churned Soil Particles Cloud behind rotavator -->
    <circle cx="-50" cy="120" r="8" fill="#8D6E63" opacity="0.6"/>
    <circle cx="-65" cy="115" r="12" fill="#A1887F" opacity="0.5"/>
    <circle cx="-80" cy="125" r="15" fill="#BCAAA4" opacity="0.4"/>
  </g>

  <!-- Tag badge -->
  <rect x="24" y="24" width="260" height="44" rx="22" fill="rgba(0,0,0,0.65)"/>
  <circle cx="46" cy="46" r="12" fill="#2E7D32"/>
  <text x="70" y="52" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold">Rotavator / Tilling (சுழல் உழவு)</text>
</svg>

