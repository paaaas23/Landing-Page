<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Seed Drill Hopper Box -->
  <polygon points="12,14 52,14 44,28 20,28" stroke="#2E7D32" stroke-width="3" fill="rgba(46,125,50,0.15)"/>
  <!-- Seed Level -->
  <line x1="18" y1="20" x2="46" y2="20" stroke="#FFA000" stroke-width="2.5" stroke-dasharray="3 2"/>
  <!-- Fertilizer / Seed Tubes -->
  <line x1="22" y1="28" x2="16" y2="44" stroke="#5D4037" stroke-width="2.5"/>
  <line x1="32" y1="28" x2="32" y2="44" stroke="#5D4037" stroke-width="2.5"/>
  <line x1="42" y1="28" x2="48" y2="44" stroke="#5D4037" stroke-width="2.5"/>
  <!-- Furrow Openers / Tines -->
  <path d="M16 44l-4 6h6" stroke="#2E7D32" stroke-width="2.5"/>
  <path d="M32 44l-4 6h6" stroke="#2E7D32" stroke-width="2.5"/>
  <path d="M48 44l-4 6h6" stroke="#2E7D32" stroke-width="2.5"/>
  <!-- Dropping Golden Seeds into Furrow -->
  <circle cx="16" cy="54" r="2.5" fill="#FBC02D" stroke="#FFA000" stroke-width="1"/>
  <circle cx="32" cy="54" r="2.5" fill="#FBC02D" stroke="#FFA000" stroke-width="1"/>
  <circle cx="48" cy="54" r="2.5" fill="#FBC02D" stroke="#FFA000" stroke-width="1"/>
  <!-- Sprouting Plant on top -->
  <path d="M32 14v-6c-2 0-4-3-4-5 3 0 5 3 5 5" stroke="#4CAF50" stroke-width="2" fill="rgba(76,175,80,0.3)"/>
  <path d="M32 8c2 0 4-3 4-5-3 0-5 3-5 5" stroke="#4CAF50" stroke-width="2" fill="rgba(76,175,80,0.3)"/>
</svg>

