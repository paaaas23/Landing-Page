<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Smooth Laser / Mechanical Land Level Line -->
  <line x1="4" y1="52" x2="60" y2="52" stroke="#2E7D32" stroke-width="3.5"/>
  <!-- Uneven soil dots before leveling -->
  <path d="M4 42q6-4 12 0t12 0" stroke="#795548" stroke-width="2" stroke-dasharray="2 3"/>
  <!-- Leveller Scraper Blade Box -->
  <path d="M16 26l32 0v16H16z" stroke="#2E7D32" stroke-width="3" fill="rgba(46,125,50,0.18)"/>
  <line x1="16" y1="42" x2="48" y2="42" stroke="#FFA000" stroke-width="3"/>
  <!-- Laser Mast / Transmitter Sensor Mast -->
  <line x1="32" y1="26" x2="32" y2="12" stroke="#5D4037" stroke-width="2.5"/>
  <circle cx="32" cy="10" r="4" stroke="#FBC02D" stroke-width="2" fill="#FFA000"/>
  <!-- Laser Beam signals -->
  <path d="M24 10h-6M40 10h6" stroke="#FFA000" stroke-width="1.8" stroke-dasharray="2 2"/>
  <!-- Depth adjusting linkage -->
  <line x1="22" y1="26" x2="14" y2="38" stroke="#5D4037" stroke-width="2"/>
  <line x1="42" y1="26" x2="50" y2="38" stroke="#5D4037" stroke-width="2"/>
  <!-- Level Indicator Bubble / Symbol -->
  <circle cx="32" cy="34" r="3" fill="#2E7D32"/>
</svg>

