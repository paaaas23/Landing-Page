  <circle cx="46" cy="46" r="7" stroke="#5D4037" stroke-width="3" fill="rgba(93,64,55,0.2)"/>
  <circle cx="46" cy="46" r="3" fill="#5D4037"/>
  <!-- Loaded Harvest Sacks or Sugarcane/Produce -->
  <path d="M18 22c0-5 6-6 8 0M30 22c0-7 8-7 10 0M44 22c0-6 7-6 9 0" stroke="#FBC02D" stroke-width="2.5" fill="rgba(251,192,45,0.25)"/>
