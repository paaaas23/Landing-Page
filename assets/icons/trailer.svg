  <line x1="24" y1="22" x2="24" y2="42" stroke="#2E7D32" stroke-width="2"/>
  <line x1="36" y1="22" x2="36" y2="42" stroke="#2E7D32" stroke-width="2"/>
  <line x1="48" y1="22" x2="48" y2="42" stroke="#2E7D32" stroke-width="2"/>
  <line x1="14" y1="32" x2="58" y2="32" stroke="#2E7D32" stroke-width="1.8"/>
  <!-- Drawbar Hitch & Tongue extending left to tractor -->
